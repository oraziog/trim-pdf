[package]
name = "pdfsplit"
description = "Split very large PDFs into parts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pdfsplit"
path = "src/main.rs"

# The window. Kept behind a feature so the command line stays a 478 KiB binary that needs no
# graphics stack, and so a plain `cargo build` never pulls egui.
[[bin]]
name = "pdfsplit-gui"
path = "src/bin/pdfsplit-gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "dep:rfd"]

[lints]
workspace = true

[dependencies]
splitter = { path = "../../crates/splitter" }
# Both backends, and the measurement that says why: glow alone makes the window 4.6 MiB instead of
# 8.0 MiB, but on a machine with no OpenGL 2.0 — this one, a remote desktop, a bare virtual machine
# — `egui_glow requires opengl 2.0+` and the window never opens. wgpu brings its own renderer there,
# so it is the first one tried and glow is the fallback. wgpu is pinned to Direct3D 12 at run time:
# its default backends on Windows include Vulkan, and the Intel Vulkan runtime (igvk64.dll) crashes
# the whole process before any fallback can run.
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wgpu", "clipboard", "links"] }
rfd = { version = "0.17", optional = true }

# Le icone e le proprietà dei due eseguibili (build.rs). Solo su Windows: altrove non serve, e
# non si porta dietro il resource compiler.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
